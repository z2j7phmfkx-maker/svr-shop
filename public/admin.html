<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administration sécurisée</title>
  <link rel="stylesheet" href="/admin.css">
  <script src="/admin.js" defer></script>
</head>
<body>
  <main>
    <h1>Administration</h1>
    <p>Édite les données JSON, puis valide. Le serveur refusera les champs inconnus et les valeurs invalides.</p>
    <textarea id="editor" spellcheck="false" aria-label="Données de la boutique"></textarea>
    <div class="actions">
      <button id="reloadButton">Recharger</button>
      <button id="saveButton">Enregistrer</button>
    </div>
    <section>
      <h2>Envoyer un média</h2>
      <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime">
      <button id="uploadButton">Envoyer</button>
      <output id="uploadResult"></output>
    </section>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
